services:
  postgres:
    image: postgres:16
    container_name: payflow-postgres
    environment:
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: payflow
      POSTGRES_DB: payflow
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - payflow_pgdata:/var/lib/postgresql/data
volumes:
  payflow_pgdata: